<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=client/index.html">
    <title>TravelUp Global — Dynamic Tourism & Algorithmic Travel Engine</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="client/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="client/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="client/apple-touch-icon.png">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #004d40 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            text-align: center;
        }
        .redirect-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 2.5rem 3rem;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #00e676;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.6rem;
            margin: 0 0 0.5rem;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 0.95rem;
            color: #cbd5e1;
            margin: 0 0 1.5rem;
            line-height: 1.5;
        }
        a.btn {
            display: inline-block;
            background: #00966d;
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem 1.75rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        a.btn:hover {
            background: #00b383;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 150, 109, 0.4);
        }
    </style>
    
    <script>
        // Seamless and instant redirection to client application
        window.location.replace('client/index.html');
    </script>
</head>
<body>
    <div class="redirect-card">
        <div class="spinner"></div>
        <h1>TravelUp Global</h1>
        <p>Connecting to the multimodal travel & tourism engine. Loading live experience...</p>
        <a href="client/index.html" class="btn">Enter TravelUp Global &rarr;</a>
    </div>
</body>
</html>
