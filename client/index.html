<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelUp Global</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            font-family: 'Inter', system-ui, sans-serif;
            color: #0f172a;
        }
        .canvas-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .logo-img {
            max-width: 320px;
            height: auto;
            margin-bottom: 1.5rem;
        }
        .pill {
            display: inline-block;
            background: #e0f2fe;
            color: #0284c7;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 0.5rem;
            color: #0f172a;
        }
        p {
            font-size: 1rem;
            color: #64748b;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Minimal Clean Canvas -->
    <div class="canvas-container">
        <img src="images/logo.png" alt="TravelUp Global" class="logo-img">
        <div class="pill">🎨 Fresh Clean Canvas Ready</div>
        <h1>TravelUp Global Home Page</h1>
        <p>
            The project workspace is ready. You can now provide your preferred layout, navbar, sections, colors, and feature requirements to build this page step by step.
        </p>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
