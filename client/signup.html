<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — TravelUp Global</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f8fafc 100%);
        }
        .auth-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: var(--shadow-xl);
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 0.5rem;">
                    TravelUp<span>Global</span>
                </a>
                <p style="font-size: 0.85rem; color: var(--text-muted);">
                    Register for an intelligent dynamic travel account
                </p>
            </div>

            <!-- Error message container -->
            <div id="auth-error" style="display: none; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

            <form id="signup-form" onsubmit="handleSignup(event)">
                <div class="input-group" style="margin-bottom: 1.25rem;">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" required placeholder="e.g. Md. Tanvir Parvaj">
                </div>

                <div class="input-group" style="margin-bottom: 1.25rem;">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" required placeholder="name@example.com">
                </div>

                <div class="input-group" style="margin-bottom: 1.25rem;">
                    <label>Mobile Phone</label>
                    <input type="tel" id="reg-phone" placeholder="+880 1712-345678">
                </div>

                <div class="input-group" style="margin-bottom: 1.25rem;">
                    <label>Password</label>
                    <input type="password" id="reg-password" required placeholder="Minimum 6 characters">
                </div>

                <!-- Role Selection -->
                <div class="input-group" style="margin-bottom: 1.25rem;">
                    <label>Account Role</label>
                    <select id="reg-role" onchange="toggleStaffCode()">
                        <option value="customer" selected>Customer / Traveler</option>
                        <option value="admin">Operations Staff / Admin</option>
                    </select>
                </div>

                <!-- Staff Registration Code (Visible only if Admin selected) -->
                <div class="input-group" id="staff-code-group" style="display: none; margin-bottom: 1.5rem; background: #fef2f2; padding: 0.85rem; border-radius: var(--radius-md); border: 1px solid #fecaca;">
                    <label style="color: #991b1b;">Staff Security Registration Code</label>
                    <input type="text" id="reg-staff-code" placeholder="Enter ADMIN2026 or ADMIN123" style="border-color: #fca5a5;">
                    <small style="color: #b91c1c; font-size: 0.75rem;">Required for university faculty and operational roles.</small>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem;" id="reg-btn">
                    Create My Account
                </button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
                Already have an account? <a href="login.html" style="font-weight: 700;">Sign In</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function toggleStaffCode() {
            const role = document.getElementById('reg-role').value;
            const staffGroup = document.getElementById('staff-code-group');
            staffGroup.style.display = role === 'admin' ? 'block' : 'none';
        }

        async function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;
            const staffCode = document.getElementById('reg-staff-code').value.trim();

            const btn = document.getElementById('reg-btn');
            const errBox = document.getElementById('auth-error');

            errBox.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Registering Account...';

            try {
                const res = await API.request('/api/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({
                        name, email, phone, password, role,
                        staff_code: role === 'admin' ? staffCode : null
                    })
                });

                if (res.success) {
                    Auth.setUser(res.user, res.token);
                    alert('Registration successful! Welcome to TravelUp Global.');
                    if (res.user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }
            } catch (err) {
                errBox.textContent = err.message || 'Registration failed.';
                errBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Create My Account';
            }
        }
    </script>
</body>
</html>
