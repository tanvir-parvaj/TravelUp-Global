<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — TravelUp Global</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f8fafc 100%);
        }
        .auth-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-xl);
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 0.5rem;">
                    TravelUp<span>Global</span>
                </a>
                <p style="font-size: 0.85rem; color: var(--text-muted);">
                    Sign in to your dynamic travel management portal
                </p>
            </div>

            <!-- Error message container -->
            <div id="auth-error" style="display: none; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="input-group" style="margin-bottom: 1.25rem;">
                    <label>Email Address</label>
                    <input type="email" id="login-email" required placeholder="admin@travelupglobal.com or your email" value="admin@travelupglobal.com">
                </div>

                <div class="input-group" style="margin-bottom: 1.5rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label>Password</label>
                        <small style="color: var(--text-muted); font-size: 0.75rem;">Default: admin123 / user123</small>
                    </div>
                    <input type="password" id="login-password" required placeholder="••••••••" value="admin123">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem;" id="login-btn">
                    Sign In to Portal
                </button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
                Don't have an account? <a href="signup.html" style="font-weight: 700;">Create Account</a>
            </div>

            <!-- Quick Demo Credentials Box -->
            <div style="margin-top: 2rem; background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1rem; font-size: 0.75rem; color: var(--text-muted);">
                <strong>⚡ Quick Academic Demo Accounts:</strong><br>
                • <strong>Admin / Staff:</strong> admin@travelupglobal.com | admin123<br>
                • <strong>Customer:</strong> user@travelupglobal.com | user123
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            const errBox = document.getElementById('auth-error');

            errBox.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Verifying Credentials...';

            try {
                const res = await API.request('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                if (res.success) {
                    Auth.setUser(res.user, res.token);
                    if (res.user.role === 'admin' || res.user.role === 'staff') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }
            } catch (err) {
                errBox.textContent = err.message || 'Invalid email or password.';
                errBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign In to Portal';
            }
        }
    </script>
</body>
</html>
