<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Modern Rounded Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)"/>

  <!-- Orbital Travel Arc -->
  <path d="M12 44 C 18 20, 42 16, 52 22" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>

  <!-- Soaring Airplane Symbol -->
  <g transform="translate(32,32) rotate(45) translate(-32,-32)" filter="url(#dropShadow)">
    <path d="M32 10 L35.5 24 L50 30 L50 34 L35.5 32 L35.5 45 L41 49 L41 53 L32 51 L23 53 L23 49 L28.5 45 L28.5 32 L14 34 L14 30 L28.5 24 Z" fill="#ffffff"/>
  </g>

  <!-- Sparkle Accent -->
  <circle cx="48" cy="16" r="2" fill="#93c5fd"/>
</svg>
